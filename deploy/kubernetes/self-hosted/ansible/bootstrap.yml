---
- name: Prepare every fixed-capacity Kubernetes node
  hosts: kube_control_plane:kube_workers
  become: true
  gather_facts: true
  tasks:
    - name: Require Ubuntu nodes
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
        fail_msg: "This bootstrap is intentionally written for Ubuntu 24.04 nodes provisioned by Terraform."

    - name: Disable swap for kubelet
      ansible.builtin.command: swapoff -a
      changed_when: ansible_swaptotal_mb | int > 0

    - name: Keep swap disabled after restart
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?!#)(.*\\s+swap\\s+.*)$'
        replace: '# \\1'

    - name: Load Kubernetes kernel modules on boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kubernetes.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load Kubernetes kernel modules now
      ansible.builtin.command: "modprobe {{ item }}"
      changed_when: false
      loop: [overlay, br_netfilter]

    - name: Persist Kubernetes network sysctls
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply Kubernetes network sysctls
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Install containerd and Kubernetes package prerequisites
      ansible.builtin.apt:
        name: [apt-transport-https, ca-certificates, containerd, curl, gpg, python3-debian]
        state: present
        update_cache: true

    - name: Create containerd configuration directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate the upstream containerd configuration
      ansible.builtin.command: containerd config default
      register: containerd_default_config
      changed_when: false

    - name: Configure containerd to use systemd cgroups
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
        mode: "0644"
      notify: Restart containerd

    - name: Enable the container runtime
      ansible.builtin.systemd_service:
        name: containerd
        state: started
        enabled: true

    - name: Create the Kubernetes apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install the Kubernetes package signing key
      ansible.builtin.shell:
        cmd: >-
          curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/Release.key |
          gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Configure the Kubernetes package repository
      ansible.builtin.deb822_repository:
        name: kubernetes
        types: [deb]
        uris: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/"
        suites: [/]
        signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        state: present

    - name: Install kubelet, kubeadm, and kubectl
      ansible.builtin.apt:
        name: [kubelet, kubeadm, kubectl]
        state: present
        update_cache: true

    - name: Prevent unplanned Kubernetes package upgrades
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
        enabled: true

- name: Initialise the first control-plane node
  hosts: kube_bootstrap_control_plane
  become: true
  tasks:
    - name: Initialise the kubeadm control plane
      ansible.builtin.command:
        argv:
          - kubeadm
          - init
          - --apiserver-advertise-address={{ kube_node_ip }}
          - --control-plane-endpoint={{ kubernetes_api_endpoint }}:6443
          - --pod-network-cidr={{ kubernetes_pod_cidr }}
          - --upload-certs
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create kubeconfig directory for the Ubuntu operator account
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0700"

    - name: Install the cluster-admin kubeconfig for the Ubuntu operator account
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        remote_src: true
        dest: /home/ubuntu/.kube/config
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Create a control-plane join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_command
      changed_when: false

    - name: Upload control-plane certificates for joining nodes
      ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
      register: kubeadm_certificate_key
      changed_when: false

    - name: Store join data for the remaining bootstrap plays
      ansible.builtin.set_fact:
        kubeadm_join_command_value: "{{ kubeadm_join_command.stdout }}"
        kubeadm_certificate_key_value: "{{ kubeadm_certificate_key.stdout_lines | select('match', '^[a-f0-9]{64}$') | last }}"

- name: Join the remaining control-plane nodes
  hosts: kube_additional_control_plane
  become: true
  tasks:
    - name: Join this node to the control plane
      ansible.builtin.command: >-
        {{ hostvars[groups['kube_control_plane'][0]].kubeadm_join_command_value }}
        --control-plane --certificate-key {{ hostvars[groups['kube_control_plane'][0]].kubeadm_certificate_key_value }}
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Join the fixed worker nodes
  hosts: kube_workers
  become: true
  tasks:
    - name: Join this node as a worker
      ansible.builtin.command: "{{ hostvars[groups['kube_control_plane'][0]].kubeadm_join_command_value }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Install the cluster network and retrieve operator access
  hosts: kube_bootstrap_control_plane
  become: true
  tasks:
    - name: Download the pinned Calico manifest
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml"
        dest: /root/calico.yaml
        mode: "0600"

    - name: Configure Calico to use the cluster pod CIDR
      ansible.builtin.replace:
        path: /root/calico.yaml
        regexp: 'value: "192\\.168\\.0\\.0/16"'
        replace: 'value: "{{ kubernetes_pod_cidr }}"'

    - name: Apply Calico
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /root/calico.yaml
      register: calico_apply
      changed_when: "'configured' in calico_apply.stdout or 'created' in calico_apply.stdout"

    - name: Make the combined control-plane nodes schedulable for workloads
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf taint nodes --all
        node-role.kubernetes.io/control-plane:NoSchedule-
      register: control_plane_taint_removal
      changed_when: "'untainted' in control_plane_taint_removal.stdout"
      failed_when: >-
        control_plane_taint_removal.rc != 0 and
        'not found' not in control_plane_taint_removal.stderr

    - name: Wait for every node to become Ready
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready nodes --all --timeout=300s
      changed_when: false

    - name: Retrieve the administrator kubeconfig to the ignored local directory
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: .generated/admin.conf
        flat: true
        mode: "0600"
