apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - github.com/kubernetes-sigs/gcp-compute-persistent-disk-csi-driver/deploy/kubernetes/overlays/noauth?ref=v1.26.4

# The v1.26.4 noauth overlay uses a v1.17.4 driver image. That image supports
# the CSI controller and node service flags, but predates the optional
# multitenancy and taint-controller modes. The latter is not required for
# dynamic Persistent Disk provisioning on this fixed-capacity cluster.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: csi-gce-pd-controller
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/5
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: csi-gce-pd-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: csi-gce-pd-controller
      spec:
        template:
          spec:
            containers:
              - name: gce-pd-driver
                args:
                  - --v=5
                  - --endpoint=unix:/csi/csi.sock
                  - --supports-dynamic-iops-provisioning=hyperdisk-balanced,hyperdisk-extreme
                  - --supports-dynamic-throughput-provisioning=hyperdisk-balanced,hyperdisk-throughput,hyperdisk-ml
                  - --enable-data-cache
                  - --run-node-service=false
