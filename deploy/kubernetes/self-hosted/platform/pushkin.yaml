apiVersion: v1
kind: Service
metadata:
  name: pushkin
  namespace: pushkin-system
spec:
  selector:
    app.kubernetes.io/name: pushkin
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushkin
  namespace: pushkin-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pushkin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pushkin
        app.kubernetes.io/part-of: pushkin
    spec:
      imagePullSecrets:
        - name: pushkin-image-registry
      containers:
        - name: pushkin
          image: must-be-replaced
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: pushkin-runtime
          env:
            - name: PUSHKIN_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PUSHKIN_CASSANDRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pushkin-cassandra-superuser
                  key: username
            - name: PUSHKIN_CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pushkin-cassandra-superuser
                  key: password
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pushkin
  namespace: pushkin-system
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pushkin
                port:
                  name: http
