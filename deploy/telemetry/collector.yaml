receivers:
  prometheus:
    config:
      global:
        scrape_interval: 5s
      scrape_configs:
        - job_name: postgres
          static_configs:
            - targets: [postgres-exporter:9187]
        - job_name: redis
          static_configs:
            - targets: [redis-exporter:9121]
        - job_name: kafka
          static_configs:
            - targets: [kafka-exporter:9308]

processors:
  batch:

exporters:
  otlp:
    endpoint: telemetry:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [otlp]
