---
- name: Start ten prepared batched campaigns
  hosts: localhost
  gather_facts: false
  vars:
    state_file: "{{ benchmark_state_dir }}/batched-ten.yml"
  tasks:
    - name: Read scenario state
      ansible.builtin.include_vars:
        file: "{{ state_file }}"

    - name: Record delivery measurement start
      ansible.builtin.set_fact:
        started_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Start every prepared campaign
      ansible.builtin.uri:
        url: "http://127.0.0.1:18080/api/v1/campaigns/{{ item }}/start"
        method: POST
        headers: { X-Pushkin-API-Key: "{{ api_key }}" }
        body_format: json
        body: {}
        status_code: 200
      loop: "{{ campaign_ids }}"

    - name: Save workload result
      ansible.builtin.copy:
        dest: "{{ benchmark_results_dir }}/workload.json"
        mode: "0644"
        content: |
          {"campaign_count":10,"recipients_per_campaign":100000,"started_at":"{{ started_at }}"}
