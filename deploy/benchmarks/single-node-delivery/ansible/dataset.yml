---
- name: Prepare a single-channel inline-delivery dataset
  hosts: pushkin
  gather_facts: false
  vars:
    state_file: "{{ benchmark_state_dir }}/dataset.yml"
  tasks:
    - name: Check whether the fixture already exists
      ansible.builtin.stat:
        path: "{{ state_file }}"
      delegate_to: localhost
      register: dataset_state

    - name: Require a fresh benchmark database
      ansible.builtin.fail:
        msg: "Dataset state exists at {{ state_file }}. Recreate the environment before preparing it again."
      when: dataset_state.stat.exists
      delegate_to: localhost

    - name: Create benchmark tenant
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/v1/internal/tenants
        method: POST
        headers: { X-Pushkin-Admin-Key: "{{ lookup('ansible.builtin.password', benchmark_state_dir ~ '/admin_key chars=ascii_letters,digits length=32') }}" }
        body_format: json
        body: { name: single-node-benchmark, rate_limit_per_minute: 10000000 }
        status_code: 201
      register: tenant

    - name: Issue benchmark tenant API key
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/v1/internal/tenant-api-keys
        method: POST
        headers: { X-Pushkin-Admin-Key: "{{ lookup('ansible.builtin.password', benchmark_state_dir ~ '/admin_key chars=ascii_letters,digits length=32') }}" }
        body_format: json
        body: { tenant_id: "{{ tenant.json.tenant_id }}", name: single-node-benchmark }
        status_code: 201
      register: api_key

    - name: Create benchmark push provider
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/v1/providers
        method: POST
        headers: { X-Pushkin-API-Key: "{{ api_key.json.api_key }}" }
        body_format: json
        body: { type: fcm, credentials: benchmark-credential, rate_limit_qps: 100000, rate_limit_burst: 100000 }
        status_code: 201
      register: provider

    - name: Create benchmark mobile application
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/v1/mobile-applications
        method: POST
        headers: { X-Pushkin-API-Key: "{{ api_key.json.api_key }}" }
        body_format: json
        body: { provider_id: "{{ provider.json.provider_id }}", platform: android, package_name: com.pushkin.benchmark }
        status_code: 201
      register: application

    - name: Create benchmark channel
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/v1/channels
        method: POST
        headers: { X-Pushkin-API-Key: "{{ api_key.json.api_key }}" }
        body_format: json
        body: { provider_id: "{{ provider.json.provider_id }}", type: mobile_push, key: benchmark }
        status_code: 201
      register: channel

    - name: Link benchmark application to its channel
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/api/v1/channels/{{ channel.json.channel_id }}/mobile-applications/{{ application.json.mobile_application_id }}"
        method: PUT
        headers: { X-Pushkin-API-Key: "{{ api_key.json.api_key }}" }
        status_code: 204

    - name: Wait until the benchmark channel is active
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/api/v1/channels/{{ channel.json.channel_id }}"
        method: GET
        headers: { X-Pushkin-API-Key: "{{ api_key.json.api_key }}" }
        status_code: 200
      register: channel_status
      until: channel_status.json.status == 'active'
      retries: 30
      delay: 1

    - name: Insert fixture users and installations in two set-based queries
      become: true
      become_user: ubuntu
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - "{{ benchmark_root }}/pushkin.compose.yml"
          - exec
          - --no-TTY
          - postgres
          - psql
          - -v
          - ON_ERROR_STOP=1
          - -U
          - pushkin
          - -d
          - pushkin
          - -c
          - "{{ lookup('ansible.builtin.template', 'templates/dataset.sql.j2') }}"
      changed_when: true

    - name: Save local dataset state
      ansible.builtin.copy:
        dest: "{{ state_file }}"
        mode: "0600"
        content: |
          api_key: {{ api_key.json.api_key }}
          user_count: {{ dataset_user_count }}
      delegate_to: localhost
